# CI: every push and pull request. Backend tests on Python 3.9 (the project's floor) and 3.11,
# the CRM tests, and the frontend lint + build. A red check blocks the merge once branch protection
# requires these jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # setup-python no longer ships 3.9 for current Ubuntu runners: use the official image instead
    container: python:${{ matrix.python }}-slim
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -e ".[dev]"
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider
      - name: Red-team guardrail suite
        run: python scripts/run_redteam.py

  crm:
    name: CRM tests
    runs-on: ubuntu-latest
    container: python:3.9-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - working-directory: crm
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
