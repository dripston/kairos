<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kairos walkthrough compositor</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="comp.css">
</head>
<body>
<div id="stage"></div>
<script src="v4.js"></script>
<script src="engine.js"></script>
<script>
  // ?film=product|technical  &t=12.5 (show one frame; the renderer calls seek(t) itself)
  (function () {
    var q = new URLSearchParams(location.search);
    var film = q.get("film") || "product";
    var s = document.createElement("script");
    s.src = "../films/" + film + ".js?v=" + Date.now();
    s.onload = function () {
      KAIROS.load(window.FILM).then(function () {
        window.ready = true;
        if (q.has("t")) seek(parseFloat(q.get("t")));
      }).catch(function (e) { window.loadError = String(e && e.stack || e); console.error(e); });
    };
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
