[project]
name = "kairos-backend"
version = "0.1.0"
description = "Kairos K06: Supervisor guardrails, atomic send ledger and executor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kairos_backend*", "spine*", "replay*"]

[tool.setuptools.package-data]
kairos_backend = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
